[package]
name = "local-agent-desktop"
version = "0.1.0"
description = "本地智能体工作台桌面外壳"
authors = ["本地智能体"]
edition = "2021"
build = "build.rs"

[lib]
name = "local_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
